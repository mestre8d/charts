        {{- end }}
      labels:
        {{- include "rathena.componentLabels" (dict "context" . "component" "char-server") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
