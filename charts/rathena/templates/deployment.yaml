{{- /*
rAthena deployments: login-server, char-server, map-server,
optional web-server, optional wsproxy.

Configuration is mounted at /opt/rathena/conf/import via a projected volume
combining the ConfigMap (non-sensitive files) and the Secret (files that
embed credentials: char_conf.txt, map_conf.txt, inter_conf.txt).

char-server and map-server are stateful (per-character data, save files,
logs); they use Recreate strategy since the PVC is RWO.
*/ -}}
{{- $fullName := include "rathena.fullname" . -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}-login-server
  labels:
    {{- include "rathena.componentLabels" (dict "context" . "component" "login-server") | nindent 4 }}
spec:
  replicas: {{ .Values.servers.loginServer.replicas }}
  selector:
    matchLabels:
      {{- include "rathena.componentSelectorLabels" (dict "context" . "component" "login-server") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmaps.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "rathena.componentLabels" (dict "context" . "component" "login-server") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "rathena.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      containers:
        - name: login-server
          image: "{{ .Values.image.name }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.imagePullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - /opt/rathena/login-server
          ports:
            - name: login-server
              containerPort: {{ .Values.servers.loginServer.containerPort }}
              protocol: TCP
          {{- with .Values.servers.loginServer.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.servers.loginServer.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: conf-import
              mountPath: /opt/rathena/conf/import
          {{- with .Values.servers.loginServer.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: conf-import
          projected:
            sources:
              - configMap:
                  name: {{ $fullName }}-conf-import
              - secret:
                  name: {{ $fullName }}-secrets
                  items:
                    - key: char_conf.txt
                      path: char_conf.txt
                    - key: map_conf.txt
                      path: map_conf.txt
                    - key: inter_conf.txt
                      path: inter_conf.txt
---
