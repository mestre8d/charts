      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      containers:
        - name: char-server
          image: "{{ .Values.image.name }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.imagePullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - /opt/rathena/char-server
          ports:
            - name: char-server
              containerPort: {{ .Values.servers.charServer.containerPort }}
              protocol: TCP
          {{- with .Values.servers.charServer.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.servers.charServer.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: conf-import
              mountPath: /opt/rathena/conf/import
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: /opt/rathena/log
              subPath: log
            - name: data
              mountPath: /opt/rathena/save
              subPath: save
            {{- end }}
          {{- with .Values.servers.charServer.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: conf-import
          projected:
            sources:
              - configMap:
                  name: {{ $fullName }}-conf-import
              - secret:
                  name: {{ $fullName }}-secrets
                  items:
                    - key: char_conf.txt
                      path: char_conf.txt
                    - key: map_conf.txt
                      path: map_conf.txt
                    - key: inter_conf.txt
                      path: inter_conf.txt
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ $fullName }}-char-server
        {{- end }}
