{{- /*
ConfigMap holding non-sensitive rAthena configuration files.
Files containing credentials (char_conf.txt, map_conf.txt, inter_conf.txt)
live in the Secret instead, and both volumes are projected together onto
/opt/rathena/conf/import at runtime.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rathena.fullname" . }}-conf-import
  labels:
    {{- include "rathena.labels" . | nindent 4 }}
data:
  atcommands.yml: ''
  battle_conf.txt: ''
  groups.yml: ''
  inter_server.yml: ''
  log_conf.txt: ''
  login_conf.txt: |
    login_port: {{ .Values.servers.loginServer.service.port }}
    use_MD5_password: {{ .Values.servers.loginServer.md5Password }}
  packet_conf.txt: ''
  script_conf.txt: ''
  web_conf.txt: |
    //bind_ip: 127.0.0.1
    web_port: {{ .Values.servers.webServer.service.port }}
    //timestamp_format: [%d/%b %H:%M]
    stdout_with_ansisequence: no
    console_msg_log: 0
    console_log_filepath: ./log/web-msg_log.log
    console_silent: 0
    print_req_res: off
    allow_gifs: yes
