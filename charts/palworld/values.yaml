# Default values for palworld.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Number of server replicas. Multi-replica is NOT supported by Palworld
# (single save file, RWO PVC). Keep this at 1.
replicaCount: 1

# -- Override the chart name (used in `app.kubernetes.io/name`).
nameOverride: ""
# -- Override the fully qualified name (default: `<release>-<chart>`).
fullnameOverride: ""

# -- Image pull secrets for private registries (applied to both server and api pods).
imagePullSecrets: []

serviceAccount:
  # -- Whether to create a ServiceAccount.
  create: true
  # -- Whether the ServiceAccount token should be auto-mounted into pods.
  automount: false
  # -- Annotations to add to the ServiceAccount.
  annotations: {}
  # -- The name of the ServiceAccount to use. If not set and create is true, a name is generated.
  name: ""

# -- Annotations added to every pod template (server and api).
podAnnotations: {}
# -- Labels added to every pod template (server and api).
podLabels: {}

# -- Pod-level securityContext applied to both server and api pods.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# -- Container-level securityContext applied to both server and api containers.
# `readOnlyRootFilesystem` is false because the upstream Palworld image writes
# to its own filesystem (SteamCMD, server data, etc.).
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# -- Node selector applied to both server and api pods.
nodeSelector: {}
# -- Tolerations applied to both server and api pods.
tolerations: []
# -- Affinity rules applied to both server and api pods.
affinity: {}
# -- PriorityClassName applied to both server and api pods.
priorityClassName: ""

# -- (dict) The server configuration
# @notationType -- bigValue
server:
  # -- Additional annotations applied to the server Deployment pod template.
  annotations: {}
  # -- Additional labels applied to the server Deployment pod template.
  labels: {}
  # -- Termination grace period for the server pod. The Palworld game server
  # needs time to flush state on shutdown.
  terminationGracePeriodSeconds: 300
  # -- (dict) Resources limits for the container.
  resources:
    limits:
      cpu: 4
      memory: "12Gi"
    requests:
      cpu: 4
      memory: "8Gi"
  # -- (dict) Define some parameters for the storage volume
  storage:
    # -- (bool) Define if it will use an existing PVC containing the installation data.
    external: false
    # -- (bool) The external PVC name to use.
    externalName: ""
    # -- Keeps helm from deleting the PVC. By default, helm does not delete pvcs.
    preventDelete: false
    # -- The size of the pvc storage.
    size: 12Gi
    # -- The storage class name. If empty, the default StorageClass is used (preserving dynamic provisioning).
    storageClassName: ""
  # -- (dict) Define the parameters for the server image container
  # @notationType -- bigValue
  image:
    # -- Name of the image, without the tag.
    name: ghcr.io/mestre8d/palworld-server-docker
    # -- The tag of the image.
    tag: latest
    # -- Define the pull policy for the server image.
    imagePullPolicy: IfNotPresent

  # -- (dict) Change the ports to be mapped to the pod.
  # If you change those, make sure to change the service.ports and server.config accordingly.
  # @notationType -- bigValue
  ports:
    # -- (dict) The "game" port definition.
    # If you change this, make sure to change the service.ports.game and server.config accordingly.
    - name: game
      containerPort: 8211
      protocol: UDP
    # -- (dict) The "query" port definition .
    # If you change this, make sure to change the service.ports.query_port and server.config accordingly.
    - name: query
      containerPort: 27015
      protocol: UDP
    # -- (dict) The "rcon" port definition. Palworld RCON is TCP.
    # If you change this, make sure to change the service.ports.rcon and server.config accordingly.
    - name: rcon
      containerPort: 25575
      protocol: TCP
  # -- (string) Deployment strategy for the server. Use Recreate because the
  # game server is a single instance backed by an RWO PVC.
  strategy: Recreate

  # -- (dict) Probes for the server container. The startupProbe gives SteamCMD
  # plenty of time to download the game on first boot (`update_on_boot`).
  # Liveness/readiness use a TCP check on the RCON port.
  startupProbe:
    tcpSocket:
      port: rcon
    failureThreshold: 60
    periodSeconds: 10
    timeoutSeconds: 5
  livenessProbe:
    tcpSocket:
      port: rcon
    initialDelaySeconds: 0
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    tcpSocket:
      port: rcon
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  # -- (dict) Override the pod-level securityContext for the server pod.
  podSecurityContext: {}
  # -- (dict) Override the container-level securityContext for the server container.
  securityContext: {}

  # -- (dict) Change the service configuration.
  # If you change those, make sure to change the server.config and server.ports accordingly.
  # @notationType -- bigValue
  service:
    # -- (bool) Enables the creation of the service component.
    enabled: true
    # -- Additional annotations to the resources
    annotations: {}
    # -- Additional labels to the resources
    labels: {}
    # -- (string) The type of service to be created.
    type: LoadBalancer
    # -- (dict) Change the ports to be mapped to the service.
    # If you change those, make sure to change the server.config and server.ports accordingly.
    # @notationType -- bigValue
    ports:
      # -- (dict) The "game" port definition.
      - name: game
        port: 8211
        protocol: UDP
        targetPort: 8211
      # -- (dict) The "query" port definition .
      - name: query
        port: 27015
        protocol: UDP
        targetPort: 27015
      # -- (dict) The "rcon" port definition. Palworld RCON is TCP.
      - name: rcon
        port: 25575
        protocol: TCP
        targetPort: 25575
  # -- (dict) Change the game server configuration.
  # If you change those, make sure to change the service.ports and server.ports accordingly.
  # Those are directly connected with the container image, providing multiple environment variables to the scripts.
  # @notationType -- bigValue
  config:
    # -- Additional annotations to the resources
    annotations: {}
    # -- Additional labels to the resources
    labels: {}
    puid: 1000
    pgid: 1000
    port: 8211
    # -- (string) The query port of the game.
    query_port: 27015
    # -- The max number of players supported.
    max_players: 16
    # -- (bool) Enables the multithreading, allowing the usage of up to 4 cores (needs citation)
    multithreading: true
    # -- (dict) Remote connection configuration.
    # Allows the remote connection and management for the server.
    # @notationType -- bigValue
    rcon:
      # -- (bool) Enables/disables the rcon port.
      enable: true
      # -- (string) The port for rcon. If you change this, make sure to change the service.ports and server.ports accordingly.
      port: 25575
      # -- (string) If not provided, a random password will be generated and stored on the secret.
      # The password is preserved across upgrades via a `lookup` on the existing Secret.
      password: ""
    community:
      # -- (bool) Enables/disables the visibility of this server on Steam community servers list.
      enable: true
      # -- (string) If not provided, a random password will be generated and stored on the secret.
      password: ""
    # -- (string) If not provided, a random server name will be generated with the "palworld_" prefix.
    server_name: ""
    # -- (string) The timezone used for time stamping backup server. Use the IANA TZ format with Area/Location
    timezone: "UTC"
    # -- (string) You can manually specify the global IP address of the network on which the server running.
    public_ip: ""
    # -- (string) You can manually specify the port number of the network on which the server running.
    public_port: ""
    # -- (string) Your server description to be shown in game
    server_description: ""
    # -- (string) Update/Install the server when the container starts.
    # THIS HAS TO BE ENABLED THE FIRST TIME YOU RUN THE CONTAINER.
    # On first boot SteamCMD downloads the full game which can take many minutes;
    # the startupProbe is configured with a high failureThreshold to allow this.
    update_on_boot: true
    # -- (object) Configures the game world settings.
    # @notationType -- bigValue
    world_parameters:
      DAYTIME_SPEEDRATE: "1.000000"
      NIGHTTIME_SPEEDRATE: "1.000000"
      EXP_RATE: "1.000000"
      PAL_CAPTURE_RATE: "1.000000"
      PAL_SPAWN_NUM_RATE: "1.000000"
      PAL_DAMAGE_RATE_ATTACK: "1.000000"
      PAL_DAMAGE_RATE_DEFENSE: "1.000000"
      PLAYER_DAMAGE_RATE_ATTACK: "1.000000"
      PLAYER_DAMAGE_RATE_DEFENSE: "1.000000"
      PLAYER_STOMACH_DECREASE_RATE: "1.000000"
      PLAYER_STAMINA_DECREASE_RATE: "1.000000"
      PLAYER_AUTO_HP_REGEN_RATE: "1.000000"
      PLAYER_AUTO_HP_REGEN_RATE_IN_SLEEP: "1.000000"
      PAL_STOMACH_DECREASE_RATE: "1.000000"
      PAL_STAMINA_DECREASE_RATE: "1.000000"
      PAL_AUTO_HP_REGEN_RATE: "1.000000"
      PAL_AUTO_HP_REGEN_RATE_IN_SLEEP: "1.000000"
      BUILD_OBJECT_DAMAGE_RATE: "1.000000"
      BUILD_OBJECT_DETERIORATION_DAMAGE_RATE: "1.000000"
      COLLECTION_DROP_RATE: "1.000000"
      COLLECTION_OBJECT_HP_RATE: "1.000000"
      COLLECTION_OBJECT_RESPAWN_SPEED_RATE: "1.000000"
      ENEMY_DROP_ITEM_RATE: "1.000000"
      DEATH_PENALTY: "All"
      ENABLE_PLAYER_TO_PLAYER_DAMAGE: "False"
      ENABLE_FRIENDLY_FIRE: "False"
      ENABLE_INVADER_ENEMY: "True"
      ACTIVE_UNKO: "True"
      ENABLE_AIM_ASSIST_PAD: "True"
      ENABLE_AIM_ASSIST_KEYBOARD: "False"
      DROP_ITEM_MAX_NUM: "3000"
      DROP_ITEM_MAX_NUM_UNKO: "1000"
      BASE_CAMP_MAX_NUM: "128"
      BASE_CAMP_WORKER_MAXNUM: "15"
      DROP_ITEM_ALIVE_MAX_HOURS: "1.000000"
      AUTO_RESET_GUILD_NO_ONLINE_PLAYERS: "False"
      AUTO_RESET_GUILD_TIME_NO_ONLINE_PLAYERS: "72.000000"
      GUILD_PLAYER_MAX_NUM: "3"
      PAL_EGG_DEFAULT_HATCHING_TIME: "72.000000"
      WORK_SPEED_RATE: "1.000000"
      IS_MULTIPLAY: "False"
      IS_PVP: "False"
      CAN_PICKUP_OTHER_GUILD_DEATH_PENALTY_DROP: "False"
      ENABLE_NON_LOGIN_PENALTY: "True"
      ENABLE_FAST_TRAVEL: "True"
      IS_START_LOCATION_SELECT_BY_MAP: "True"
      EXIST_PLAYER_AFTER_LOGOUT: "False"
      ENABLE_DEFENSE_OTHER_GUILD_PLAYER: "False"
      COOP_PLAYER_MAX_NUM: "4"
      REGION: ""
      USEAUTH: "True"
      BAN_LIST_URL: "https://api.palworldgame.com/api/banlist.txt"

api:
  # -- (bool) Enables the standalone API Deployment.
  # NOTE: If `attach_to_game_server: true`, set `enabled: false` to avoid running
  # a duplicate API container. The chart will fail-fast if both are true.
  enabled: true
  # -- (bool) Set this to true to attach the API container as a sidecar inside
  # the game server Deployment (sharing localhost with the RCON port).
  # When true, you MUST set `api.enabled: false`.
  attach_to_game_server: false
  # -- Additional annotations applied to the api Deployment pod template.
  annotations: {}
  # -- Additional labels applied to the api Deployment pod template.
  labels: {}
  # -- (string) Deployment strategy for the api Deployment.
  strategy: RollingUpdate
  # -- (dict) Define the parameters for the API image container
  # @notationType -- bigValue
  image:
    # -- Name of the image, without the tag.
    name: ghcr.io/mestre8d/palworld-rcon-buddy
    # -- The tag of the image.
    tag: latest
    # -- Pull policy for the api image.
    imagePullPolicy: IfNotPresent

  # -- (dict) Probes for the API container (HTTP GET on `/`).
  startupProbe:
    httpGet:
      path: /
      port: api
    failureThreshold: 30
    periodSeconds: 5
    timeoutSeconds: 3
  livenessProbe:
    httpGet:
      path: /
      port: api
    initialDelaySeconds: 0
    periodSeconds: 30
    timeoutSeconds: 3
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /
      port: api
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

  # -- (dict) Override the pod-level securityContext for the api pod.
  podSecurityContext: {}
  # -- (dict) Override the container-level securityContext for the api container.
  securityContext: {}

  # -- Resources for the api container.
  resources: {}

  # -- (dict) Change the API server configuration.
  # @notationType -- bigValue
  config:
    # -- (string) The RCON server hostname. If empty, the in-cluster server Service is used.
    server_host: ""
    rcon_port: 25575
    # -- (string) The RCON password. If empty, the same password generated for
    # the game server is reused (read from the shared Secret).
    rcon_password: ""
    # -- (number) The query port the API exposes for queries.
    query_port: 27015
    # -- (number) The TTL of the cached information for the /info endpoint, in milliseconds.
    info_cache_duration: 5000
    # -- (string) The bearer token to be used in authenticated requests. Stored in the shared Secret.
    bearer_token: ""
    # -- (number) The API container port. This port will be present on the service, deployment and configmap.
    port: 3000
  service:
    # -- (bool) Enables the creation of the service component.
    enabled: true
    # -- Additional annotations to the resources
    annotations: {}
    # -- Additional labels to the resources
    labels: {}
    # -- (string) The type of service to be created.
    type: ClusterIP
    # -- (number) Port number on the service.
    port: 80
    # -- (string) The protocol of the service port.
    protocol: TCP
