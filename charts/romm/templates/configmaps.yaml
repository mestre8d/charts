apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "romm.fullname" . }}-config
  labels:
    {{- include "romm.labels" . | nindent 4 }}
    {{- with .Values.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.server.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.server.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  config.yml: |
{{ .Values.server.configuration.config | indent 4 }}
