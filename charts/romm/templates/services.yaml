{{- if .Values.server.service.create -}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "romm.fullname" . }}
  labels:
    {{- include "romm.labels" . | nindent 4 }}
    {{- with .Values.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.server.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.server.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.server.service.type }}
  selector:
    {{- include "romm.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.server.service.port }}
      protocol: TCP
      targetPort: http
{{- end }}
