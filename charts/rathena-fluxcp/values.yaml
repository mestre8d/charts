# Default values for rathena-fluxcp.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  name: ghcr.io/mestre8d/rathena-fluxcp
  tag: v0.0.1
  imagePullPolicy: IfNotPresent

# Image pull secrets for private registries.
imagePullSecrets:
  - name: registry-auth

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# Pod-level annotations. Note: a checksum/config annotation is always added by the chart.
podAnnotations: {}
# Pod-level labels.
podLabels: {}

# Pod-level security context.
podSecurityContext: {}
  # fsGroup: 2000

# Container-level security context.
securityContext: {}
  # capabilities:
  #   drop:
  #     - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# Pod scheduling.
nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""

resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# HTTP probe configuration. Probes hit "/" on the container port.
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# Persistent storage for the data/tmp directory.
persistence:
  enabled: true
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  # If set, the chart will use this PVC instead of creating one.
  existingClaim: ""

configuration:
  serverName: FluxRO
  baseUri: /
  # SECURITY: must be supplied at install time. No default committed.
  installerPassword: ""
  serverAddress: localhost
  servers:
    login_server:
      host: 127.0.0.1
      port: 6900
    map_server:
      host: 127.0.0.1
      port: 6121
    char_server:
      host: 127.0.0.1
      port: 5121
    databases:
      config:
        host: 127.0.0.1
        username: ragnarok
        # SECURITY: must be supplied at install time. No default committed.
        password: ""
        database: ragnarok
        timezone: +0:00
      log:
        host: 127.0.0.1
        username: ragnarok
        # SECURITY: must be supplied at install time. No default committed.
        password: ""
        database: ragnarok
        timezone: +0:00
      web:
        host: 127.0.0.1
        username: ragnarok
        # SECURITY: must be supplied at install time. No default committed.
        password: ""
        database: ragnarok

service:
  labels: {}
  annotations: {}
  port: 80
  container:
    port: 80
  type: ClusterIP

ingress:
  enabled: false
  className: ""
  labels: {}
  annotations: {}
  pathType: Prefix
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local
