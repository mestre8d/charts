{{- if .Values.vote.ingress.create }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "voting-app.fullname" . }}-vote-ingress
  labels:
    {{- include "voting-app.componentLabels" (dict "context" . "component" "vote") | nindent 4 }}
    {{- with .Values.vote.ingress.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.vote.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.vote.ingress.ingressClassName }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  rules:
    - http:
        paths:
          {{- if empty .Values.vote.ingress.paths }}
          - backend:
              service:
                name: {{ include "voting-app.fullname" . }}-vote-svc
                port:
                  number: {{ .Values.vote.service.port }}
            pathType: {{ .Values.vote.ingress.pathType | default "Prefix" }}
            {{- with .Values.vote.ingress.path }}
            path: {{ . }}
            {{- end }}
          {{- else }}
{{ tpl (toYaml .Values.vote.ingress.paths | indent 10) . }}
          {{- end }}
      {{- with .Values.vote.ingress.hostName }}
      host: {{ tpl . $ | quote }}
      {{- end }}
  {{- if not (empty .Values.vote.ingress.tls) }}
  tls:
{{ tpl (toYaml .Values.vote.ingress.tls) . | indent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.result.ingress.create }}
