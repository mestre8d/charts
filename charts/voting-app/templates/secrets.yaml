{{- /*
   Resolve the password ONCE per render so the embedded value in
   POSTGRES_HOST_STRING agrees with POSTGRES_PASSWORD even on first
   install (where `lookup` is empty and `randAlphaNum` would otherwise
   produce two different values).
*/ -}}
{{- $password := include "database.password" . -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "voting-app.fullname" . }}-database-secret
  labels:
    {{- include "voting-app.componentLabels" (dict "context" . "component" "database") | nindent 4 }}
    {{- with .Values.database.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.database.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $password | quote }}
  POSTGRES_HOST_STRING: {{ printf "postgres://%s:%s@%s/%s" .Values.database.username $password (include "postgres.host" .) .Values.database.databaseName | quote }}
