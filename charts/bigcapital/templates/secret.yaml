apiVersion: v1
kind: Secret
metadata:
  name: app-env
  labels:
    {{- include "bigcapital.labels" . | nindent 4 }}
type: Opaque
stringData:
  # App
  {{- $existing := lookup "v1" "Secret" .Release.Namespace "app-env" }}
  {{- $existingJwt := "" }}
  {{- if and $existing $existing.data }}
  {{-   if index $existing.data "APP_JWT_SECRET" }}
  {{-     $existingJwt = index $existing.data "APP_JWT_SECRET" | b64dec }}
  {{-   end }}
  {{- end }}
  APP_JWT_SECRET: {{ .Values.server.secret_string | default $existingJwt | default (randAlphaNum 64) | quote }}

  # Mail
  MAIL_HOST: ""
  MAIL_USERNAME: ""
  MAIL_PASSWORD: ""
  MAIL_PORT: ""
  MAIL_SECURE: ""
  MAIL_FROM_NAME: ""
  MAIL_FROM_ADDRESS: ""

  # Database
  {{- $dbCreds := .Values.database.credentials }}
  {{- $dbExt := .Values.database.external }}
  {{- $useExternalDb := $dbExt.enabled }}
  {{- $dbHost := "" }}
  {{- $dbPort := "" }}
  {{- $dbUser := "" }}
  {{- $dbPassword := "" }}
  {{- $dbRootPassword := "" }}
  {{- $systemDbName := "" }}
  {{- if $useExternalDb }}
  {{-   $dbHost = required "database.external.host is required when database.external.enabled=true" $dbExt.host }}
  {{-   $dbPort = $dbExt.port }}
  {{-   $dbUser = required "database.external.user is required when database.external.enabled=true" $dbExt.user }}
  {{-   $dbPassword = required "database.external.password is required when database.external.enabled=true" $dbExt.password }}
  {{-   $dbRootPassword = $dbExt.rootPassword }}
  {{-   $systemDbName = required "database.external.systemDbName is required when database.external.enabled=true" $dbExt.systemDbName }}
  {{- else }}
  {{-   $dbHost = $dbCreds.host | default (printf "%s-database" (include "bigcapital.fullname" .)) }}
  {{-   $dbPort = $dbCreds.port }}
  {{-   $dbUser = $dbCreds.user }}
  {{-   $dbPassword = $dbCreds.password }}
  {{-   $dbRootPassword = $dbCreds.rootPassword }}
  {{-   $systemDbName = $dbCreds.systemDbName }}
  {{- end }}
  DB_HOST: {{ $dbHost | quote }}
  DB_PORT: {{ $dbPort | quote }}
  DB_USER: {{ $dbUser | quote }}
  DB_PASSWORD: {{ $dbPassword | quote }}
  DB_ROOT_PASSWORD: {{ $dbRootPassword | quote }}

  # System database
  SYSTEM_DB_NAME: {{ $systemDbName | quote }}
  SYSTEM_DB_USER: ""
  SYSTEM_DB_PASSWORD: ""

  # Tenant databases
  TENANT_DB_HOST: ""
  TENANT_DB_USER: ""
  TENANT_DB_PASSWORD: ""

  # Application
  BASE_URL: "http://example.com"
  JWT_SECRET: "b0JDZW56RnV6aEthb0RGPXVEcUI"

  # App proxy
  PUBLIC_PROXY_PORT: "80"
  PUBLIC_PROXY_SSL_PORT: "443"

  # Sign-up restrictions
  SIGNUP_DISABLED: "false"
  SIGNUP_ALLOWED_DOMAINS: ""
  SIGNUP_ALLOWED_EMAILS: ""

  # Sign-up Email Confirmation
  SIGNUP_EMAIL_CONFIRMATION: "false"

  # API rate limit (points,duration,block duration).
  API_RATE_LIMIT: "120,60,600"

  # Gotenberg API for PDF printing - (production).
  # Gotenberg runs as a sidecar in the same Pod, so it's reachable on
  # localhost at the configured api-port (see deployment.yaml args).
  GOTENBERG_URL: {{ printf "http://localhost:%v" .Values.gotenberg.service.port | quote }}
  GOTENBERG_DOCS_URL: {{ printf "http://localhost:%v/public/" .Values.server.service.port | quote }}

  # Exchange Rate Service
  EXCHANGE_RATE_SERVICE: "open-exchange-rate"

  # Open Exchange Rate
  OPEN_EXCHANGE_RATE_APP_ID: ""

  # Plaid
  PLAID_ENV: "sandbox"
  PLAID_CLIENT_ID: ""
  PLAID_SECRET: ""
  PLAID_LINK_WEBHOOK: ""

  # Lemon Squeezy
  LEMONSQUEEZY_API_KEY: ""
  LEMONSQUEEZY_STORE_ID: ""
  LEMONSQUEEZY_WEBHOOK_SECRET: ""

  # S3 documents and attachments
  S3_REGION: "US"
  S3_ACCESS_KEY_ID: ""
  S3_SECRET_ACCESS_KEY: ""
  S3_ENDPOINT: ""
  S3_BUCKET: ""

  # PostHog
  POSTHOG_API_KEY: ""
  POSTHOG_HOST: ""

  # Stripe Payment
  STRIPE_PAYMENT_SECRET_KEY: ""
  STRIPE_PAYMENT_PUBLISHABLE_KEY: ""
  STRIPE_PAYMENT_CLIENT_ID: ""
  STRIPE_PAYMENT_WEBHOOKS_SECRET: ""
  STRIPE_PAYMENT_REDIRECT_URL: "https://example.com/preferences/payment-methods/stripe/callback"
