# Default values for bigcapital.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This chart packs every component (webapp, server, gotenberg, MariaDB,
# Redis) into a single Pod. The in-Pod databases use RWO PVCs, so
# multi-replica is broken by design and replicaCount is hard-pinned to
# 1 in the rendered Deployment regardless of this value.
replicaCount: 1

# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# Top-level pull secrets. Used in addition to per-component
# `image.imagePullSecrets`. Each entry is the name of an existing
# Secret of type kubernetes.io/dockerconfigjson in the release namespace.
imagePullSecrets: []

# ServiceAccount used by the Pod.
serviceAccount:
  create: true
  automount: true
  annotations: {}
  # If `create: true` and `name` is empty, defaults to the chart fullname.
  # If `create: false` and `name` is empty, defaults to "default".
  name: ""

webapp:
  resources: {}
  annotations: {}
  labels: {}
  image:
    registry: "ghcr.io"
    image: "bigcapitalhq/webapp"
    tag: "latest"
    pullPolicy: IfNotPresent
    imagePullSecrets: []
  service:
    enabled: true
    type: ClusterIP
    port: 80
  ingress:
    enabled: false
    annotations: {}
    labels: {}
    ingressClassName: ""
    # List of hosts and the paths they expose. Each path is routed to the
    # webapp Service on `webapp.service.port`.
    #
    # Example:
    #   hosts:
    #     - host: bigcapital.example.com
    #       paths:
    #         - path: /
    #           pathType: Prefix
    hosts: []
    # Optional TLS blocks, passed through verbatim to spec.tls.
    #
    # Example:
    #   tls:
    #     - hosts:
    #         - bigcapital.example.com
    #       secretName: bigcapital-tls
    tls: []
  # Container-level securityContext (overrides chart-wide `securityContext`).
  securityContext: {}
  livenessProbe:
    enabled: true
    httpGet:
      path: /
      port: http-webapp
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    enabled: true
    httpGet:
      path: /
      port: http-webapp
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6


server:
  resources: {}
  annotations: {}
  labels: {}
  secret_string: ""
  image:
    registry: "ghcr.io"
    image: "bigcapitalhq/server"
    tag: "latest"
    pullPolicy: IfNotPresent
    imagePullSecrets: []
  service:
    enabled: true
    type: ClusterIP
    port: 3000
  securityContext: {}
  livenessProbe:
    enabled: true
    tcpSocket:
      port: http-server
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    enabled: true
    tcpSocket:
      port: http-server
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

gotenberg:
  resources: {}
  annotations: {}
  labels: {}
  image:
    registry: "ghcr.io"
    image: "gotenberg/gotenberg"
    tag: "7"
    pullPolicy: IfNotPresent
    imagePullSecrets: []
  service:
    enabled: true
    type: ClusterIP
    port: 9000
  storage:
    size: 1Gi
    # Empty string means "use the cluster default StorageClass". Set
    # to a specific class (e.g. "standard", "gp3", "longhorn") to pin.
    storageClass: ""
    accessMode: ReadWriteOnce
    annotations: {}
    labels: {}
  securityContext: {}
  livenessProbe:
    enabled: true
    httpGet:
      path: /health
      port: http-gotenberg
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    enabled: true
    httpGet:
      path: /health
      port: http-gotenberg
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

database:
  # Set to false to skip rendering the in-cluster MariaDB container/PVC
  # and instead use the external database defined under `database.external`.
  enabled: true
  resources: {}
  annotations: {}
  labels: {}
  image:
    registry: "docker.io"
    image: "library/mariadb"
    tag: "10"
    pullPolicy: IfNotPresent
    imagePullSecrets: []
  service:
    enabled: true
    type: ClusterIP
    port: 3306
  storage:
    size: 1Gi
    # Empty string means "use the cluster default StorageClass".
    storageClass: ""
    accessMode: ReadWriteOnce
    annotations: {}
    labels: {}
  # Credentials and DB names used when running the in-cluster MariaDB
  # (i.e. when `database.external.enabled` is false). These are also
  # used to initialize the MariaDB container (MYSQL_* env vars).
  #
  # NOTE: `charset` and `tenantDbPrefix` are intentionally NOT exposed.
  # Upstream bigcapital hardcodes `charset: utf8` and the tenant DB prefix
  # `bigcapital_tenant_` in its runtime Knex connections, so overriding
  # them either has no effect or breaks tenant connectivity.
  credentials:
    host: ""              # leave empty to default to the in-cluster service hostname
    port: 3306
    user: "bigcapital"
    password: "bigcapital"
    rootPassword: "root"
    systemDbName: "bigcapital_system"
  # Use an external database instead of the bundled MariaDB.
  # When `enabled: true`, these values override `database.credentials`
  # in the rendered `app-env` Secret, and the in-cluster MariaDB
  # container/PVC are NOT rendered.
  #
  # The `bigcapital` server creates and drops tenant databases dynamically
  # (CREATE DATABASE bigcapital_tenant_<id>), so the `user` here MUST have
  # global CREATE and DROP privileges on the database server.
  external:
    enabled: false
    host: ""
    port: 3306
    user: ""
    password: ""
    rootPassword: ""
    systemDbName: ""
  securityContext: {}
  livenessProbe:
    enabled: true
    tcpSocket:
      port: tcp-database
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    enabled: true
    tcpSocket:
      port: tcp-database
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

redis:
  enabled: true
  resources: {}
  annotations: {}
  labels: {}
  image:
    registry: "docker.io"
    image: "library/redis"
    tag: "6"
    pullPolicy: IfNotPresent
    imagePullSecrets: []
  service:
    enabled: true
    type: ClusterIP
    port: 6379
  storage:
    size: 1Gi
    # Empty string means "use the cluster default StorageClass".
    storageClass: ""
    accessMode: ReadWriteOnce
    annotations: {}
    labels: {}
  securityContext: {}
  livenessProbe:
    enabled: true
    tcpSocket:
      port: tcp-redis
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    enabled: true
    tcpSocket:
      port: tcp-redis
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

# Pod-level securityContext applied to the entire Pod. Overridable
# wholesale; the defaults below are merged into the Pod spec when this
# map is non-empty.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# Default container-level securityContext, used as the base for every
# container that does not set its own `securityContext` block. We
# intentionally leave `readOnlyRootFilesystem: false` because the
# bundled images (especially MariaDB and Redis on first init) write
# inside the rootfs.
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

nodeSelector: {}
tolerations: []
affinity: {}
